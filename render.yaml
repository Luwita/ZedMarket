# Render Blueprint: in Render choose New → Blueprint and pick this repository.
# Settings marked `sync: false` are secrets: Render asks for them when the Blueprint is created.
services:
  - type: web
    name: zedmarket
    runtime: node
    plan: free
    # Next to the Neon database (Frankfurt), the closest region to Zambia.
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Neon's pooled connection string (host name contains -pooler), used for the app's queries.
      - key: DATABASE_URL
        sync: false
      # Neon's direct connection string (no -pooler), used to apply database updates when the server starts.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Clerk (https://dashboard.clerk.com > API keys). The secret key stays on the server; the publishable key is
      # built into the website, so it must be set before the build runs.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: REACT_APP_CLERK_PUBLISHABLE_KEY
        sync: false
      # Owners: the email addresses they sign in with, comma-separated (verified by Clerk).
      # Order alerts by email (Resend). Optional: without them alerts stay in the app only.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # The value is kept in Render (Environment), not here, because this repository is public.
      - key: ADMIN_EMAILS
        sync: false
