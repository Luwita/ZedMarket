# Render Blueprint: in Render choose New → Blueprint and pick this repository.
# Settings marked `sync: false` are secrets: Render asks for them when the Blueprint is created.
services:
  - type: web
    name: zedmarket
    runtime: node
    plan: free
    # Next to the Neon database (Frankfurt), the closest region to Zambia.
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Neon's pooled connection string (host name contains -pooler), used for the app's queries.
      - key: DATABASE_URL
        sync: false
      # Neon's direct connection string (no -pooler), used to apply database updates when the server starts.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Neon Auth: the production branch's NEON_AUTH_BASE_URL (neon env pull --branch production).
      - key: NEON_AUTH_BASE_URL
        sync: false
      # Signs the sign-in session cookie; Render makes a random one.
      - key: NEON_AUTH_COOKIE_SECRET
        generateValue: true
      # Owners: phone numbers they verify on their account, and/or email addresses, comma-separated.
      - key: ADMIN_PHONES
        sync: false
      # The value is kept in Render (Environment), not here, because this repository is public.
      - key: ADMIN_EMAILS
        sync: false
      # Test mode is on while no SMS provider is paid for: phone codes are shown on screen (never staff or
      # owner codes; those are only in the server log). "0" sends codes only by SMS. Set explicitly, because
      # removing a key here doesn't remove it on Render.
      - key: SHOW_SIGNIN_CODES
        value: "0"
      # Email (Resend): password-reset and other emailed codes. EMAIL_FROM must be on a domain verified in Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
